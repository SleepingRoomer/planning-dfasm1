name: Sonder la structure des sheets (temporaire)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/probe-sheets.mjs"
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/probe-sheets.mjs
